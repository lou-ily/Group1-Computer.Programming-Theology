<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">The Augustinian Sanctuary</title>
  <desc id="logo-desc">A green and gold Augustinian Sanctuary emblem with a cross, heart, and laurel leaves.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ef" />
      <stop offset="1" stop-color="#e7eee7" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfc27e" />
      <stop offset="1" stop-color="#b08a4c" />
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="238" fill="url(#background)" stroke="#536957" stroke-width="12" />
  <circle cx="256" cy="256" r="207" fill="none" stroke="#c7a86b" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" />

  <!-- Laurel leaves -->
  <g fill="#879b86" stroke="#536957" stroke-width="5" stroke-linejoin="round">
    <path d="M153 371c-32-12-54-34-65-65 28 2 52 18 65 45 7-32 23-57 49-74 1 34-12 66-49 94Z" />
    <path d="M359 371c32-12 54-34 65-65-28 2-52 18-65 45-7-32-23-57-49-74-1 34 12 66 49 94Z" />
  </g>

  <!-- Heart and cross: a single self-contained mark, with no external image dependency -->
  <path d="M256 369c-9-10-91-75-91-143 0-32 24-56 54-56 17 0 30 8 37 22 7-14 20-22 37-22 30 0 54 24 54 56 0 68-82 133-91 143Z" fill="#fff" stroke="#536957" stroke-width="8" />
  <path d="M240 143h32v49h30v32h-30v56h-32v-56h-30v-32h30z" fill="url(#gold)" />

  <path d="M177 397h158" stroke="#c7a86b" stroke-width="7" stroke-linecap="round" />
</svg>
